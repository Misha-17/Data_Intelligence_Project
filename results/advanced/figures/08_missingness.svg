  <g id="text_18">
   <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e8b" x="11.52" y="18.397969" transform="rotate(-0 11.52 18.397969)">ARMD | EXPLORATORY ANALYSIS</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183b4e" x="11.52" y="48.637031" transform="rotate(-0 11.52 48.637031)">Missing information is common in every data split</text>
  </g>
  <g id="text_20">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #788a96" x="11.52" y="71.838406" transform="rotate(-0 11.52 71.838406)">Source information before imputation | each culture counted once for the shared clinical fields</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #788a96" transform="translate(11.52 464.872922)">Laboratory, vital-sign and antibiotic-exposure fields use one record per culture. Candidate resistance history uses one record per culture and</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #788a96" transform="translate(11.52 476.660602)">candidate drug. No record means unknown; it does not establish no prior exposure or no prior resistance. Similar missing rates alone do not</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #788a96" transform="translate(11.52 488.448281)">establish comparable patients.</text>
  </g>
 </g>
